<!DOCTYPE html>

</head>


<body>
    <div class="container">

        <!-- AD -->
        <div class="top-ad">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7799357616183197"

        <div class="content-wrapper">

            <!-- AD -->
            <div class="side-ad">

                    data-ad-slot="2304561335" data-ad-format="auto" data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>


            <div class="player-container">

                            type="application/vnd.apple.mpegurl">
                    </video>
                </div>

                <script>
                    const player = videojs('live-stream', {
                        liveui: true,
                        fluid: true,
                        aspectRatio: '16:9'
                    });
                    player.on('error', () => {
                        console.error('An error occurred:', player.error());
                    });
                </script>

            </div>

            <!-- AD -->
            <div class="side-ad">
